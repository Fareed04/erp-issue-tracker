<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.addEventListener('error', (e) => {
        if (e.message && (e.message.includes('$$typeof') || e.message.includes('cross-origin'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
